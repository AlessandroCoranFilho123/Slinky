name: Testes

# Roda a suíte net8.0 independente de WinUI no CI. O app também é compilado
# localmente/na validação de Windows porque seu host exige o runtime do WinUI 3.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar testes
        run: dotnet restore Tests/Slinky.Tests.csproj

      - name: Rodar testes
        run: dotnet test Tests/Slinky.Tests.csproj --configuration Release --no-restore
