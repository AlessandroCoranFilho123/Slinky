name: Publicar pacotes do Slinky

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: Pacote ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
            rid: win-x86
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: >-
          dotnet restore Slinky/Slinky.csproj
          --runtime ${{ matrix.rid }}
          --property:Platform=${{ matrix.platform }}
          --property:PublishTrimmed=false
          --property:PublishReadyToRun=false
          --property:WindowsAppSDKSelfContained=true

      - name: Criar certificado temporário
        shell: pwsh
        run: |
          $certificate = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Slinky Release' -CertStoreLocation 'Cert:\CurrentUser\My' -HashAlgorithm SHA256 -KeyExportPolicy Exportable
          Export-Certificate -Cert $certificate -FilePath "$env:GITHUB_WORKSPACE\Slinky-Development.cer" -Type CERT | Out-Null
          "APPX_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Gerar pacote MSIX
        run: >-
          dotnet build Slinky/Slinky.csproj
          --configuration Release
          --no-restore
          --property:Platform=${{ matrix.platform }}
          --property:RuntimeIdentifier=${{ matrix.rid }}
          --property:GenerateAppxPackageOnBuild=true
          --property:PublishReadyToRun=false
          --property:PublishTrimmed=false
          --property:WindowsAppSDKSelfContained=true
          --property:AppxPackageSigningEnabled=true
          --property:PackageCertificateThumbprint=$env:APPX_CERT_THUMBPRINT

      - name: Preparar assets da release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $bundle = Get-ChildItem -Path Slinky -Filter *.msixbundle -Recurse -File |
            Where-Object { $_.FullName -notmatch '\\obj\\' } |
            Select-Object -First 1
          if ($null -eq $bundle) { throw 'MSIXBundle não foi gerado.' }
          Copy-Item $bundle.FullName "release-assets\Slinky-${{ github.ref_name }}-${{ matrix.platform }}.msixbundle"
          if ('${{ matrix.platform }}' -eq 'x64') {
            Copy-Item Slinky-Development.cer 'release-assets\Slinky-Development.cer'
            Copy-Item scripts\Install-ReleasePackage.ps1 'release-assets\Install-Slinky.ps1'
          }

      - name: Publicar artefato intermediário
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets
          if-no-files-found: error

  release:
    name: Criar GitHub Release
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Baixar assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          name: Slinky ${{ github.ref_name }}
          body_path: RELEASE-NOTES.md
          generate_release_notes: false
          files: release-assets/*
        # generate_release_notes false on purpose: on v2 it REPLACED the curated
        # body_path content with the auto changelog (observed on v1.0.4). The
        # curated file carries the full notes; RELEASE-NOTES.md stays the source.
