name: Publicar pacotes do Slinky

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: Pacote ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
            rid: win-x86
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: >-
          dotnet restore Slinky/Slinky.csproj
          --runtime ${{ matrix.rid }}
          --property:Platform=${{ matrix.platform }}
          --property:PublishTrimmed=false
          --property:PublishReadyToRun=false
          --property:WindowsAppSDKSelfContained=true

      - name: Criar certificado temporário
        shell: pwsh
        run: |
          $certificate = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Slinky Release' -CertStoreLocation 'Cert:\CurrentUser\My' -HashAlgorithm SHA256 -KeyExportPolicy Exportable
          Export-Certificate -Cert $certificate -FilePath "$env:GITHUB_WORKSPACE\Slinky-Release.cer" -Type CERT | Out-Null
          "APPX_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Gerar pacote MSIX
        run: >-
          dotnet build Slinky/Slinky.csproj
          --configuration Release
          --no-restore
          --property:Platform=${{ matrix.platform }}
          --property:RuntimeIdentifier=${{ matrix.rid }}
          --property:GenerateAppxPackageOnBuild=true
          --property:PublishReadyToRun=false
          --property:PublishTrimmed=false
          --property:WindowsAppSDKSelfContained=true
          --property:AppxPackageSigningEnabled=true
          --property:PackageCertificateThumbprint=$env:APPX_CERT_THUMBPRINT

      - name: Preparar assets da release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $bundle = Get-ChildItem -Path Slinky -Filter *.msixbundle -Recurse -File |
            Where-Object { $_.FullName -notmatch '\\obj\\' } |
            Select-Object -First 1
          if ($null -eq $bundle) { throw 'MSIXBundle não foi gerado.' }
          Copy-Item $bundle.FullName "release-assets\Slinky-${{ github.ref_name }}-${{ matrix.platform }}.msixbundle"
          if ('${{ matrix.platform }}' -eq 'x64') {
            Copy-Item Slinky-Release.cer 'release-assets\Slinky-Release.cer'
            Copy-Item scripts\Install-Slinky.ps1 'release-assets\Install-Slinky.ps1'
          }

      - name: Publicar artefato intermediário
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets
          if-no-files-found: error

  release:
    name: Criar GitHub Release
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Baixar assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Ler release notes curadas
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<EOF_SLINKY_NOTES'
            cat RELEASE-NOTES.md
            echo 'EOF_SLINKY_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Publicar release
        uses: softprops/action-gh-release@v3
        with:
          name: Slinky ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false
          files: release-assets/*
        # body via GITHUB_OUTPUT (multilinha, determinístico). O body_path da
        # action v2 foi IGNORADO nas releases v1.0.4/v1.0.5 (corpo publicado
        # vazio) — observado duas vezes e corrigido via API; este caminho evita
        # o problema. generate_release_notes false on purpose: on v2 it also
        # REPLACED the curated body with the auto changelog (observed on v1.0.4).
